<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Vazirmatn, sans-serif">
  <defs>
    <linearGradient id="bWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="bSide" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="140" fill="#edeae5"/>
  <polygon points="0,660 1200,720 1200,900 0,900" fill="#b99b74"/>
  <polygon points="0,660 1200,720 1200,760 0,700" fill="#000" opacity="0.06"/>

  <!-- دیوار کناری راست -->
  <polygon class="wall" points="900,140 1200,140 1200,760 900,700" fill="#dde1da"/>
  <polygon points="900,140 1200,140 1200,760 900,700" fill="url(#bSide)"/>

  <!-- دیوار اصلی -->
  <polygon class="wall" points="0,140 900,140 900,700 0,660" fill="#e8e4dd"/>
  <polygon points="0,140 900,140 900,700 0,660" fill="url(#bWall)"/>

  <polygon points="0,140 900,140 900,158 0,158" fill="#ffffff" opacity="0.8"/>

  <!-- پنجره‌ی بزرگ -->
  <rect x="90" y="220" width="300" height="300" rx="6" fill="#ffffff"/>
  <rect x="106" y="236" width="268" height="268" fill="#cfe6f0"/>
  <polygon points="106,236 260,236 106,400" fill="#fff" opacity="0.4"/>
  <line x1="240" y1="236" x2="240" y2="504" stroke="#fff" stroke-width="9"/>
  <line x1="106" y1="370" x2="374" y2="370" stroke="#fff" stroke-width="9"/>

  <!-- تابلوی بالای تخت -->
  <rect x="560" y="250" width="120" height="90" rx="4" fill="#fff"/>
  <rect x="570" y="260" width="100" height="70" fill="#cf9d6b"/>
  <rect x="700" y="250" width="120" height="90" rx="4" fill="#fff"/>
  <rect x="710" y="260" width="100" height="70" fill="#9ab0a0"/>

  <!-- تخت -->
  <g>
    <rect x="470" y="430" width="470" height="70" rx="12" fill="#c9c2b4"/>
    <rect x="470" y="480" width="520" height="240" rx="16" fill="#e7e1d3"/>
    <rect x="470" y="690" width="520" height="60" rx="12" fill="#b7ae9b"/>
    <rect x="500" y="500" width="150" height="90" rx="14" fill="#ffffff"/>
    <rect x="670" y="500" width="150" height="90" rx="14" fill="#ffffff"/>
    <path d="M470 560 Q720 520 990 560 L990 610 Q720 570 470 610 Z" fill="#8a9a86"/>
  </g>

  <!-- پاتختی + آباژور -->
  <rect x="985" y="560" width="120" height="160" rx="8" fill="#9c7b56"/>
  <rect x="1010" y="470" width="70" height="20" rx="4" fill="#4a4a4a"/>
  <polygon points="1000,470 1090,470 1075,410 1015,410" fill="#f0d9a8"/>

  <!-- گیاه -->
  <rect x="250" y="600" width="50" height="120" rx="6" fill="#444"/>
  <path d="M275 600 C220 540 235 450 275 430 C315 450 330 540 275 600 Z" fill="#5f8f52"/>
</svg>
